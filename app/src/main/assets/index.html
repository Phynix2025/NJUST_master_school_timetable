<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scheduleScreen">
    <header class="top">
      <div class="title-row">
        <h1>课在掌心</h1>
        <button class="sync" onclick="startSync()">同步课表</button>
      </div>
      <p id="status">把本学期课程放到手机里</p>
    </header>
    <nav class="tabs">
      <button class="tab active" data-view="today">今天</button>
      <button class="tab" data-view="tomorrow">明天</button>
      <button class="tab" data-view="week">本周</button>
    </nav>
    <main class="main">
      <h2 class="section-title" id="heading"></h2>
      <p class="subtitle" id="subtitle"></p>
      <div id="next"></div>
      <div id="list"></div>
    </main>
  </div>

  <section class="course-detail-screen hidden" id="courseDetailScreen" aria-label="课程详情">
    <header class="detail-header">
      <button class="detail-back" id="detailBack" aria-label="返回课程表">‹</button>
      <div><span>课程详情</span><h2 id="detailTitle"></h2></div>
    </header>
    <main class="detail-main">
      <div class="detail-summary" id="detailSummary"></div>
      <section class="detail-section">
        <div class="detail-section-title"><h3>课程笔记</h3><span id="noteSaveStatus">自动保存</span></div>
        <textarea id="courseNote" maxlength="100000" placeholder="记录老师口述的重点、作业要求或复习提示……"></textarea>
      </section>
      <section class="detail-section">
        <div class="detail-section-title"><div><h3>课程图片</h3><p>仅保存原图片的访问引用，不会复制图片。</p></div><button class="add-image" id="addCourseImage">＋ 添加图片</button></div>
        <div class="course-images" id="courseImages"></div>
      </section>
    </main>
  </section>

  <section class="map-screen hidden" id="mapScreen" aria-label="校园地图">
    <div class="map-viewport" id="mapViewport">
      <div class="map-canvas" id="mapCanvas">
        <div id="tileLayer"></div>
        <div class="accuracy-circle hidden" id="accuracyCircle"></div>
        <div class="map-marker hidden" id="locationMarker">
          <div class="marker-scale"><div class="location-heading" id="locationHeading"><span class="location-arrow"></span><span class="location-dot"></span></div></div>
        </div>
        <div class="map-marker hidden" id="targetMarker">
          <div class="marker-scale target-visual"><span class="flag-pole"></span><span class="flag-cloth"></span><span class="marker-label" id="targetLabel"></span></div>
        </div>
      </div>
    </div>
    <div class="map-header">
      <div class="map-heading-row"><strong>校园地图</strong><span>一切数据以学校官网为准</span></div>
      <div class="map-search-wrap">
        <span class="search-icon">⌕</span>
        <input id="buildingSearch" type="search" placeholder="搜索教学楼、食堂或校门" autocomplete="off">
        <button id="clearSearch" class="clear-search hidden" aria-label="清空搜索">×</button>
      </div>
      <div class="search-results hidden" id="searchResults"></div>
    </div>
    <div class="map-status" id="mapStatus">正在加载校园地图…</div>
    <div class="map-controls">
      <button id="locateButton" aria-label="定位到我的位置">●</button>
      <button id="fitButton" aria-label="同时显示当前位置和目标">◎</button>
      <button id="zoomInButton" aria-label="放大">＋</button>
      <button id="zoomOutButton" aria-label="缩小">－</button>
    </div>
  </section>

  <section class="image-preview hidden" id="imagePreview" aria-label="图片预览" aria-hidden="true">
    <div class="image-preview-stage" id="imagePreviewStage">
      <img id="imagePreviewContent" alt="课程图片预览" draggable="false">
    </div>
    <div class="image-preview-toolbar">
      <button id="imagePreviewClose" aria-label="关闭图片预览">×</button>
      <span id="imagePreviewLabel"></span>
      <div class="image-preview-zoom">
        <button id="imagePreviewZoomOut" aria-label="缩小图片">－</button>
        <button id="imagePreviewReset" aria-label="重置图片缩放">1:1</button>
        <button id="imagePreviewZoomIn" aria-label="放大图片">＋</button>
      </div>
    </div>
  </section>

  <button class="map-fab" id="mapFab" aria-label="打开校园地图">
    <span id="mapFabIcon">⌖</span><span id="mapFabText">地图</span>
  </button>
  <div class="footer">课表仅保存在本机 · 登录凭据经设备密钥加密保存</div>

  <section class="mask hidden" id="loginMask">
    <div class="login-panel">
      <div class="login-mark">N</div>
      <h2>请输入 NJUST 研究生管理系统账号密码</h2>
      <p>首次登录后，应用会安全保存凭据。之后同步课表无需再次输入。</p>
      <label class="field"><span>账号</span><input id="username" autocomplete="username" placeholder="学号"></label>
      <label class="field"><span>密码</span><input id="password" class="password" autocomplete="current-password" placeholder="请输入密码"></label>
      <button class="login-submit" onclick="submitLogin()">登录并同步课表</button>
      <p class="login-note">若学校要求验证码，将仅在首次或会话过期时提示你手动完成。</p>
    </div>
  </section>
  <section class="mask hidden" id="captchaMask">
    <div class="login-panel">
      <div class="login-mark">✓</div>
      <h2>完成验证码</h2>
      <p>账号与密码已填写。输入图片中的验证码后继续同步。</p>
      <img class="captcha-image" id="captchaImage" alt="学校验证码">
      <button class="refresh-link" onclick="refreshCaptchaImage()">看不清？重新加载验证码</button>
      <label class="field"><span>验证码</span><input id="captchaCode" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入图片中的数字"></label>
      <button class="login-submit" onclick="submitCaptcha()">确认并同步</button>
    </div>
  </section>
  <section class="mask hidden" id="loadingMask">
    <div class="loading-box"><div class="spinner"></div><b>加载中…</b><p>正在安全同步最新课表</p></div>
  </section>

  <script src="map/map-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
