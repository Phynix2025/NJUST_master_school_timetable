<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#142b42;font:16px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.top{padding:25px 20px 19px;background:linear-gradient(135deg,#102b4b,#236baa);color:#fff}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:23px;margin:0;letter-spacing:.5px}.top p{opacity:.84;font-size:13px;margin:7px 0 17px}.sync{background:#fff;color:#165da5;border:0;border-radius:11px;padding:10px 13px;font-size:14px;font-weight:700}.tabs{display:flex;gap:8px;padding:14px 16px 0}.tab{flex:1;border:0;border-radius:10px;padding:10px 4px;background:#e8eef6;color:#486581;font-size:14px;font-weight:700}.tab.active{background:#1d6fc4;color:#fff;box-shadow:0 4px 10px #1d6fc433}.main{padding:17px 16px 82px}.section-title{font-size:17px;font-weight:800;margin:0 0 5px}.subtitle{font-size:13px;color:#627d98;margin:0 0 13px}.next{display:flex;gap:10px;align-items:flex-start;background:#e9f4ff;color:#155b9e;padding:12px;border-radius:12px;margin-bottom:14px;font-size:14px;line-height:1.45}.next b{display:block;color:#174a78}.badge{flex:0 0 auto;background:#cfe8ff;color:#1264ae;padding:3px 7px;border-radius:7px;font-size:12px;font-weight:800}.card{background:#fff;border:1px solid #dbe5ef;border-left:5px solid #2476df;border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:0 2px 7px #102a430a}.time{font-size:13px;font-weight:800;color:#155fba}.name{font-size:17px;font-weight:800;margin:7px 0 9px;line-height:1.35}.info{display:flex;gap:8px;color:#526d87;font-size:14px;line-height:1.45;margin-top:4px}.icon{width:17px;text-align:center}.notice{background:#e9f2ff;color:#175aab;padding:15px;border-radius:12px;line-height:1.6}.day{margin:19px 2px 9px;font-weight:800;color:#294661}.week-day:first-child{margin-top:0}.toast{position:fixed;z-index:3;left:16px;right:16px;bottom:18px;padding:13px 15px;border-radius:12px;background:#153f69;color:#fff;box-shadow:0 5px 22px #102a4366;font-size:14px}.toast.error{background:#9d3541}.footer{position:fixed;bottom:0;left:0;right:0;padding:9px;text-align:center;border-top:1px solid #d9e2ec;background:#fff;color:#78909f;font-size:11px}.state{float:right;padding:3px 7px;border-radius:7px;background:#e5f3ff;color:#1264ae;font-size:12px}.state.live{background:#fff0c9;color:#9b6000}.card.finished{opacity:.64;border-left-color:#94a7ba;background:#f8fafc}.card.finished .time{color:#71879c}.card.finished .state{background:#e7edf3;color:#637a91}.mask{position:fixed;z-index:5;inset:0;background:#0d2f50d9;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px}.mask.hidden{display:none}.login-panel{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;border-radius:24px;padding:25px 22px 28px;box-shadow:0 12px 32px #061d3526}.login-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#1261a7,#40a5de);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:16px}.login-panel h2{margin:0;font-size:20px;line-height:1.45}.login-panel p{color:#627d98;font-size:14px;line-height:1.6;margin:8px 0 20px}.field{display:block;margin:13px 0}.field span{display:block;color:#486581;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;border:1px solid #d9e3ed;border-radius:12px;padding:13px 14px;font:16px inherit;outline:none}.field input:focus{border-color:#2476df;box-shadow:0 0 0 3px #2476df20}.field input.password{ -webkit-text-security:disc }.login-submit{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#155da5,#2789cd);color:#fff;font-size:16px;font-weight:800;margin-top:10px}.login-note{font-size:12px!important;margin:16px 0 0!important}.captcha-image{display:block;width:150px;min-height:54px;object-fit:contain;background:#f4f7fb;border:1px solid #d9e3ed;border-radius:12px;margin:14px 0}.refresh-link{border:0;background:none;color:#1d6fc4;font:14px inherit;padding:0}.loading-box{margin:auto;text-align:center;color:#fff}.spinner{width:42px;height:42px;border:4px solid #ffffff50;border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><header class="top"><div class="title-row"><h1>课在掌心</h1><button class="sync" onclick="startSync()">同步课表</button></div><p id="status">把本学期课程放到手机里</p></header><nav class="tabs"><button class="tab active" data-view="today">今天</button><button class="tab" data-view="tomorrow">明天</button><button class="tab" data-view="week">本周</button></nav><main class="main"><h2 class="section-title" id="heading"></h2><p class="subtitle" id="subtitle"></p><div id="next"></div><div id="list"></div></main><div class="footer">课表仅保存在本机 · 登录凭据经设备密钥加密保存</div><section class="mask hidden" id="loginMask"><div class="login-panel"><div class="login-mark">N</div><h2>请输入 NJUST 研究生管理系统账号密码</h2><p>首次登录后，应用会安全保存凭据。之后同步课表无需再次输入。</p><label class="field"><span>账号</span><input id="username" autocomplete="username" placeholder="学号"></label><label class="field"><span>密码</span><input id="password" class="password" autocomplete="current-password" placeholder="请输入密码"></label><button class="login-submit" onclick="submitLogin()">登录并同步课表</button><p class="login-note">若学校要求验证码，将仅在首次或会话过期时提示你手动完成。</p></div></section><section class="mask hidden" id="captchaMask"><div class="login-panel"><div class="login-mark">✓</div><h2>完成验证码</h2><p>账号与密码已填写。输入图片中的验证码后继续同步。</p><img class="captcha-image" id="captchaImage" alt="学校验证码"><button class="refresh-link" onclick="refreshCaptchaImage()">看不清？重新加载验证码</button><label class="field"><span>验证码</span><input id="captchaCode" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入图片中的数字"></label><button class="login-submit" onclick="submitCaptcha()">确认并同步</button></div></section><section class="mask hidden" id="loadingMask"><div class="loading-box"><div class="spinner"></div><b>加载中…</b><p>正在安全同步最新课表</p></div></section>
<script>
const times={1:'08:00–08:45',2:'08:50–09:35',3:'09:40–10:25',4:'10:40–11:25',5:'11:30–12:15',6:'14:00–14:45',7:'14:50–15:35',8:'15:50–16:35',9:'16:40–17:25',10:'17:30–18:15',11:'19:00–19:45',12:'19:50–20:35',13:'20:40–21:25'};const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];let view='today',schedule=null;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateAt(d,n){let r=new Date(d);r.setDate(r.getDate()+n);return r}function monday(d){let r=new Date(d.getFullYear(),d.getMonth(),d.getDate());r.setDate(r.getDate()-(r.getDay()+6)%7);return r}function fmt(d){return `${d.getMonth()+1}月${d.getDate()}日`}function weekNo(d){if(!schedule)return 0;if(schedule.termWeek1){let start=monday(new Date(`${schedule.termWeek1}T12:00:00`));return Math.floor((monday(d)-start)/604800000)+1}if(!schedule.syncWeek)return 0;return schedule.syncWeek+Math.round((monday(d)-monday(new Date()))/604800000)}
function inWeeks(spec,week){if(!week)return true;return (spec.match(/\d+(?:\s*-\s*\d+)?/g)||[]).some(p=>{let a=p.split('-').map(x=>Number(x.trim()));return a.length===1?a[0]===week:week>=a[0]&&week<=a[1]})}function parse(text,slot){let out=[],rx=/([^；;｛{]+)[｛{]([\s\S]*?)[｝}]/g,m;while((m=rx.exec(text))){let body=m[2],wm=body.match(/(.+?)周/),teacher=(body.match(/教师\s*[:：]\s*([^,，\]\n]+)/)||[])[1]||'',place=(body.match(/地点\s*[:：]\s*([^\]\n]+)/)||[])[1]||'';out.push({name:m[1].trim(),weeks:wm?wm[1].trim():'',teacher:teacher.trim(),place:place.trim(),section:slot.section,weekday:slot.weekday})}return out.length?out:[{name:text.trim(),weeks:'',teacher:'',place:'',section:slot.section,weekday:slot.weekday}]}
function mergeCourses(courses){let merged=[];courses.forEach(c=>{let prev=merged[merged.length-1],same=prev&&prev.name===c.name&&prev.teacher===c.teacher&&prev.place===c.place&&prev.weeks===c.weeks&&prev.sectionEnd===c.section-1;if(same){prev.sectionEnd=c.section;return}merged.push({...c,sectionEnd:c.section})});return merged}function coursesOn(d){if(!schedule)return[];let week=weekNo(d),day=weekdays[d.getDay()];return mergeCourses(schedule.slots.filter(s=>s.weekday===day).flatMap(s=>parse(s.text,s)).filter(c=>inWeeks(c.weeks,week)).sort((a,b)=>a.section-b.section))}function minute(value){let p=value.split(':').map(Number);return p[0]*60+p[1]}function periodTime(c){return `${times[c.section].split('–')[0]}–${times[c.sectionEnd].split('–')[1]}`}function stateOf(c,d){if(d.toDateString()!==new Date().toDateString())return'';let now=new Date(),clock=now.getHours()*60+now.getMinutes(),start=minute(times[c.section].split('–')[0]),end=minute(times[c.sectionEnd].split('–')[1]);return clock>=end?'finished':clock>=start?'live':''}function sectionLabel(c){return c.section===c.sectionEnd?`第 ${c.section} 节`:`第 ${c.section}–${c.sectionEnd} 节`}function card(c,d){let state=stateOf(c,d),label=state==='finished'?'已完成':state==='live'?'进行中':'';return `<article class="card ${state}"><div class="time">${periodTime(c)} · ${sectionLabel(c)}${label?`<span class="state ${state}">${label}</span>`:''}</div><div class="name">${esc(c.name)}</div>${c.place?`<div class="info"><span class="icon">⌖</span><span>${esc(c.place)}</span></div>`:''}${c.teacher?`<div class="info"><span class="icon">♙</span><span>${esc(c.teacher)}</span></div>`:''}<div class="info"><span class="icon">◷</span><span>${esc(c.weeks||'本学期')}周</span></div></article>`}function orderedCourses(d){let courses=coursesOn(d);return d.toDateString()===new Date().toDateString()?courses.sort((a,b)=>{let rank=x=>({live:0,'':1,finished:2}[stateOf(x,d)]);return rank(a)-rank(b)||a.section-b.section}):courses}function empty(d){return `<div class="notice">${fmt(d)}没有课程。安排好学习与休息，保持从容。</div>`}
function nextCourse(){let now=new Date();for(let i=0;i<14;i++){let d=dateAt(now,i),cs=coursesOn(d);for(let c of cs){let end=minute(times[c.sectionEnd].split('–')[1]),clock=now.getHours()*60+now.getMinutes();if(i||clock<end)return{c,d}}}return null}function showNext(){let n=nextCourse(),box=document.getElementById('next');box.innerHTML=n?`<div class="next"><span class="badge">下一节</span><div><b>${esc(n.c.name)}</b>${fmt(n.d)} ${periodTime(n.c)} · ${esc(n.c.place||'地点待定')}</div></div>`:''}
function render(){let now=new Date(),target=view==='tomorrow'?dateAt(now,1):now;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(!schedule){document.getElementById('heading').textContent='还没有课程表';document.getElementById('subtitle').textContent='同步后即可按周次查看今天、明天和本周课程';document.getElementById('list').innerHTML='<div class="notice">点击“同步课表”后输入账号密码；验证码仅在学校要求时手动完成一次。</div>';return}document.getElementById('status').textContent='一切数据以学校官网为准';showNext();if(view==='week'){let start=monday(now),html='';for(let i=0;i<7;i++){let d=dateAt(start,i),cs=orderedCourses(d);html+=`<section class="week-day"><div class="day">${weekdays[d.getDay()]} · ${fmt(d)}${d.toDateString()===now.toDateString()?' · 今天':''}</div>${cs.length?cs.map(c=>card(c,d)).join(''):''}</section>`}document.getElementById('heading').textContent=`第 ${weekNo(now)||'—'} 周课程`;document.getElementById('subtitle').textContent=`${fmt(start)}—${fmt(dateAt(start,6))} · 仅显示本周实际上课课程`;document.getElementById('list').innerHTML=html;return}let cs=orderedCourses(target),name=view==='today'?'今天':'明天';document.getElementById('heading').textContent=`${name} · ${weekdays[target.getDay()]}`;document.getElementById('subtitle').textContent=`${fmt(target)} · 第 ${weekNo(target)||'—'} 周 · ${cs.length} 门课程`;document.getElementById('list').innerHTML=cs.length?cs.map(c=>card(c,target)).join(''):empty(target)}function refreshAtNextMinute(){function tick(){render();let now=new Date();setTimeout(tick,60000-now.getSeconds()*1000-now.getMilliseconds())}let now=new Date();setTimeout(tick,60000-now.getSeconds()*1000-now.getMilliseconds())}function toggle(id,on){document.getElementById(id).classList.toggle('hidden',!on)}function startSync(){if(Android.hasCredentials())Android.beginSync();else toggle('loginMask',true)}function submitLogin(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){document.getElementById('username').focus();return}toggle('loginMask',false);toggle('loadingMask',true);Android.login(u,p)}function submitCaptcha(){let code=document.getElementById('captchaCode').value.trim();if(!code){document.getElementById('captchaCode').focus();return}toggle('captchaMask',false);toggle('loadingMask',true);Android.submitCaptcha(code)}function refreshCaptchaImage(){document.getElementById('captchaImage').removeAttribute('src');Android.refreshCaptcha()}function moveFocusedInput(){setTimeout(()=>document.activeElement?.scrollIntoView({block:'center',behavior:'smooth'}),180)}function notice(){let p=new URLSearchParams(location.search),s=p.get('sync');if(s==='loading'){toggle('loadingMask',true);return}if(s==='login-required'){toggle('loginMask',true);return}if(s==='captcha'){toggle('captchaMask',true);document.getElementById('captchaImage').src=Android.getCaptchaImage();return}if(!s)return;let el=document.createElement('div');el.className='toast '+(s==='failed'?'error':'');el.textContent=s==='success'?'课表已同步成功，已按当前周次更新。':(p.get('message')||'同步失败，请稍后重试。');document.body.appendChild(el);setTimeout(()=>el.remove(),4500)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('.login-panel input').forEach(input=>input.addEventListener('focus',moveFocusedInput));try{let raw=Android.getSchedule();schedule=raw?JSON.parse(raw):null}catch(_){schedule=null}notice();render();refreshAtNextMinute();
</script><script>
function weekStateOf(c,d){let today=new Date(),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()),nowDay=new Date(today.getFullYear(),today.getMonth(),today.getDate());if(day<nowDay)return'finished';if(day>nowDay)return'';return stateOf(c,d)}
function card(c,d,forcedState){let state=forcedState===undefined?stateOf(c,d):forcedState,label=state==='finished'?'已完成':state==='live'?'进行中':'';return `<article class="card ${state}"><div class="time">${periodTime(c)} · ${sectionLabel(c)}${label?`<span class="state ${state}">${label}</span>`:''}</div><div class="name">${esc(c.name)}</div>${c.place?`<div class="info"><span class="icon">⌖</span><span>${esc(c.place)}</span></div>`:''}${c.teacher?`<div class="info"><span class="icon">♙</span><span>${esc(c.teacher)}</span></div>`:''}<div class="info"><span class="icon">◷</span><span>${esc(c.weeks||'本学期')}周</span></div></article>`}
function weekQueue(){let start=monday(new Date()),items=[];for(let i=0;i<7;i++){let d=dateAt(start,i);coursesOn(d).forEach(c=>items.push({c,d,state:weekStateOf(c,d)}))}let rank=s=>({live:0,'':1,finished:2}[s]);return items.sort((a,b)=>{let r=rank(a.state)-rank(b.state);if(r)return r;if(a.state==='finished')return b.d-a.d||b.c.section-a.c.section;return a.d-b.d||a.c.section-b.c.section})}
function renderWeekQueue(now){let items=weekQueue(),html='',last='';items.forEach(item=>{let key=item.d.toDateString();if(key!==last){if(last)html+='</section>';html+=`<section class="week-day"><div class="day">${weekdays[item.d.getDay()]} · ${fmt(item.d)}${key===now.toDateString()?' · 今天':''}</div>`;last=key}html+=card(item.c,item.d,item.state)});return html+(last?'</section>':'')}
function render(){let now=new Date(),target=view==='tomorrow'?dateAt(now,1):now;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('status').textContent='一切数据以学校官网为准';if(!schedule){document.getElementById('heading').textContent='还没有课程表';document.getElementById('subtitle').textContent='同步后即可按周次查看今天、明天和本周课程';document.getElementById('list').innerHTML='<div class="notice">点击“同步课表”后输入账号密码；验证码仅在学校要求时手动完成一次。</div>';return}showNext();if(view==='week'){let start=monday(now);document.getElementById('heading').textContent=`第 ${weekNo(now)||'—'} 周课程`;document.getElementById('subtitle').textContent=`${fmt(start)}—${fmt(dateAt(start,6))} · 已完成课程排在最后`;document.getElementById('list').innerHTML=renderWeekQueue(now)||empty(now);return}let cs=orderedCourses(target),name=view==='today'?'今天':'明天';document.getElementById('heading').textContent=`${name} · ${weekdays[target.getDay()]}`;document.getElementById('subtitle').textContent=`${fmt(target)} · 第 ${weekNo(target)||'—'} 周 · ${cs.length} 门课程`;document.getElementById('list').innerHTML=cs.length?cs.map(c=>card(c,target)).join(''):empty(target)}
let swipeStart=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,.login-panel'))return;swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!swipeStart)return;let end=e.changedTouches[0],dx=end.clientX-swipeStart.x,dy=end.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)<60||Math.abs(dx)<=Math.abs(dy))return;let views=['today','tomorrow','week'],index=views.indexOf(view),next=index+(dx<0?1:-1);if(next>=0&&next<views.length){view=views[next];render()}},{passive:true});render();
</script></body></html>
